services:
  docktornet-server:
    container_name: docktornet-server
    # Set SERVER_IMAGE to the image you built, e.g. docktornet-server:<version>
    image: ${SERVER_IMAGE:?set SERVER_IMAGE to the image to run}
    restart: unless-stopped
    env_file: server.env
    user: "65532:65532"
    volumes:
      - ./data:/data
      - /etc/gatus/config.d:/etc/gatus/config.d
    ports:
      - "5363:5363"
    healthcheck:
      # The image is distroless; the binary probes its own /healthz.
      test: ["CMD", "/usr/local/bin/docktornet-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  docktornet-agent:
    container_name: docktornet-agent
    # Set AGENT_IMAGE to the image you built, e.g. docktornet-agent:<version>
    image: ${AGENT_IMAGE:?set AGENT_IMAGE to the image to run}
    restart: unless-stopped
    env_file: agent.env
    user: "65532:65532"
    group_add:
      - "${DOCKER_GID:-988}"
      - "${PODMAN_GID:-1001}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/user/1001/podman/podman.sock:/run/user/1001/podman/podman.sock:ro
    depends_on:
      docktornet-server:
        condition: service_healthy
