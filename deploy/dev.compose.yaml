# Dev stack for live tests. See "Live test environment" in AGENTS.md.
#
# Labelled test containers run inside the `dind` daemon, never on the host
# daemon, so an agent on the host cannot pick them up. NPM is a throwaway
# instance, Cloudflare is a stub, and every credential here is fake. Caddy is
# real; the server writes its routes into the bootstrap config's anchor route.
name: docktornet-dev

services:
  dind:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    # Only the shared unix socket: no TCP API on the compose network.
    entrypoint: ["dind", "dockerd", "--host=unix:///run/dind/docker.sock"]
    environment:
      # So `docker compose exec dind docker ...` talks to this daemon.
      DOCKER_HOST: unix:///run/dind/docker.sock
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - dind-socket:/run/dind
      - dind-data:/var/lib/docker

  npm:
    image: jc21/nginx-proxy-manager:2.12.6
    restart: unless-stopped
    environment:
      INITIAL_ADMIN_EMAIL: dev@example.com
      INITIAL_ADMIN_PASSWORD: dev-npm-password
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18081:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt

  cf-stub:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-u", "/stub/cf-stub.py"]
    environment:
      CF_STUB_TOKEN: dev-cf-token
      CF_STUB_ZONE_ID: dev-zone
      CF_STUB_ZONE_NAME: dev.test
    ports:
      - "127.0.0.1:18086:8080"
    volumes:
      - ./dev/cf-stub.py:/stub/cf-stub.py:ro

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    # --resume keeps the routes the server wrote across a restart. The admin
    # API listens on the compose network only: its port is never published.
    # The bootstrap allows the origin localhost:2019, which the caddy CLI
    # sends, so `caddy reload` works from inside the container.
    command: ["caddy", "run", "--config", "/etc/caddy/bootstrap.json", "--resume"]
    ports:
      - "127.0.0.1:18087:80"
    volumes:
      - ./dev/caddy-bootstrap.json:/etc/caddy/bootstrap.json:ro
      - caddy-config:/config

  # Docker creates missing bind-mount dirs as root. Hand dev-data to the
  # server's uid so a fresh checkout starts, and `rm -rf dev-data` works.
  dev-data-init:
    image: busybox:1.37
    command:
      - sh
      - -c
      - mkdir -p /dev-data/server-data /dev-data/gatus-config && chown -R ${DEV_UID:-1000}:${DEV_GID:-1000} /dev-data
    volumes:
      - ../dev-data:/dev-data

  gatus:
    image: twinproduction/gatus:v5.18.0
    restart: unless-stopped
    environment:
      GATUS_CONFIG_PATH: /config
    ports:
      - "127.0.0.1:18085:8080"
    volumes:
      - ../dev-data/gatus-config:/config
      - ./dev/gatus-base.yaml:/config/00-base.yaml:ro
    depends_on:
      dev-data-init:
        condition: service_completed_successfully

  docktornet-server:
    build:
      context: ..
      dockerfile: crates/server/Dockerfile
    image: docktornet-server:dev-stack
    restart: unless-stopped
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      DOCKTORNET_LISTEN: 0.0.0.0:5363
      DOCKTORNET_SECRET: dev-shared-secret-for-the-live-test-stack
      DOCKTORNET_DB_PATH: /data/docktornet.db
      DOCKTORNET_GATUS_CONFIG_DIR: /etc/gatus/config.d
      DOCKTORNET_DRY_RUN: "false"
      DOCKTORNET_ADOPT_EXISTING: "false"
      DOCKTORNET_FULL_RESYNC_INTERVAL: 30s
      DOCKTORNET_NPM_URL: http://npm:81
      DOCKTORNET_NPM_USER: dev@example.com
      DOCKTORNET_NPM_PASSWORD: dev-npm-password
      DOCKTORNET_CF_API_URL: http://cf-stub:8080/client/v4
      DOCKTORNET_CF_API_TOKEN: dev-cf-token
      DOCKTORNET_CF_ZONE_ID: dev-zone
      DOCKTORNET_CADDY_ADMIN_URL: http://caddy:2019
      RUST_LOG: info,docktornet_server=debug
    ports:
      - "127.0.0.1:15363:5363"
    healthcheck:
      # The image is distroless; the binary probes its own /healthz.
      test: ["CMD", "/usr/local/bin/docktornet-server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ../dev-data/server-data:/data
      - ../dev-data/gatus-config:/etc/gatus/config.d
      # The server reads the base config's default alert for the classification map.
      - ./dev/gatus-base.yaml:/etc/gatus/config.d/00-base.yaml:ro
    depends_on:
      dev-data-init:
        condition: service_completed_successfully
      npm:
        condition: service_started
      cf-stub:
        condition: service_started
      caddy:
        condition: service_started

  docktornet-agent:
    build:
      context: ..
      dockerfile: crates/agent/Dockerfile
    image: docktornet-agent:dev-stack
    restart: unless-stopped
    # The dind socket is 0660, group 2375 (the dind image's docker group).
    group_add:
      - "2375"
    environment:
      DOCKTORNET_SERVER_URL: http://docktornet-server:5363
      DOCKTORNET_SECRET: dev-shared-secret-for-the-live-test-stack
      DOCKTORNET_POLL_INTERVAL: 5s
      DOCKTORNET_MACHINE_ID: devbox
      DOCKTORNET_FORWARD_HOST: dind
      DOCKTORNET_SOCKETS: docker:/run/dind/docker.sock
      RUST_LOG: info,docktornet_agent=debug
    volumes:
      - dind-socket:/run/dind:ro
    depends_on:
      dind:
        condition: service_healthy
      docktornet-server:
        condition: service_healthy

volumes:
  dind-socket:
  dind-data:
  npm-data:
  npm-letsencrypt:
  caddy-config:
